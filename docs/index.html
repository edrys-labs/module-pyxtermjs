<!DOCTYPE html><html lang=en><link rel=stylesheet href=module-pyxtermjs.6bedc968.css><meta charset=utf-8><title>Python Terminal-Server</title><meta name=description content="This is a terminal-server based on <a href='https://github.com/cs01/pyxtermjs' target='_blank'>pyxtermjs</a>. A server should be started locally and shared in station mode. For more information and configuration options, see <br><a href='https://github.com/edrys-labs/module-pyxtermjs' target='_blank'>edrys-labs/module-pyxtermjs</a>"><meta name=show-in content=station><meta name=module-config content="{
        'stationConfig': {
          'server': {
            'type': 'string',
            'hint': 'Default terminal-server URl (http://localhost:5000/pty)'
          },
          'execute': {
            'type': 'string',
            'hint': 'Message subject to execute code (default: execute)'
          },
          'workflow': {
            'type': 'select',
            'hint': 'Terminal workflow (toolchain). Fills in the script below. Leave empty to write your own script.',
            'options': ['arduino-avr', 'arduino-esp32', 'arduino-nano-esp32', 'arduino-stm32', 'avr-gcc', 'micropython', 'native'],
            'presets': {
              'arduino-avr': { 'board': { 'value': 'arduino:avr:uno', 'options': ['arduino:avr:uno', 'arduino:avr:mega', 'arduino:avr:nano', 'arduino:megaavr:nona4809', 'arduino:avr:leonardo', 'arduino:avr:micro'] }, 'port': '/dev/ttyACM0', 'baud': 9600, 'filename': 'Sketch.ino', 'script': &quot;SKETCH=$(basename $FILE .ino)\nrm -rf $SKETCH &amp;&amp; arduino-cli sketch new $SKETCH\necho $CODE | base64 --decode > $SKETCH/$SKETCH.ino\narduino-cli compile -b $BOARD $SKETCH &amp;&amp;\n  arduino-cli upload -b $BOARD -p $PORT $SKETCH &amp;&amp;\n  arduino-cli monitor -p $PORT -c baudrate=$BAUD&quot; },
              'arduino-esp32': { 'board': { 'value': 'esp32:esp32:esp32', 'options': ['esp32:esp32:esp32', 'esp32:esp32:esp32s3', 'esp32:esp32:esp32c3'] }, 'port': '/dev/ttyUSB0', 'baud': 115200, 'filename': 'Sketch.ino', 'script': &quot;# needs the :esp32 image tag (the ESP32 core is not in :latest)\nSKETCH=$(basename $FILE .ino)\nrm -rf $SKETCH &amp;&amp; arduino-cli sketch new $SKETCH\necho $CODE | base64 --decode > $SKETCH/$SKETCH.ino\narduino-cli compile -b $BOARD $SKETCH &amp;&amp;\n  arduino-cli upload -b $BOARD -p $PORT $SKETCH &amp;&amp;\n  arduino-cli monitor -p $PORT -c baudrate=$BAUD&quot; },
              'arduino-nano-esp32': { 'board': { 'value': 'arduino:esp32:nano_nora', 'options': ['arduino:esp32:nano_nora'] }, 'port': '/dev/ttyACM0', 'baud': 115200, 'filename': 'Sketch.ino', 'script': &quot;# needs the arduino:esp32 core (Arduino Nano ESP32, not the Espressif core)\n# uses the default DFU upload: the board re-enumerates and runs the new\n# sketch on its own.\nSKETCH=$(basename $FILE .ino)\nrm -rf $SKETCH &amp;&amp; arduino-cli sketch new $SKETCH\necho $CODE | base64 --decode > $SKETCH/$SKETCH.ino\narduino-cli compile -b $BOARD $SKETCH &amp;&amp;\n  arduino-cli upload -b $BOARD -p $PORT $SKETCH &amp;&amp;\n  arduino-cli monitor -p $PORT -c baudrate=$BAUD&quot; },
              'arduino-stm32': { 'board': { 'value': 'NUCLEO_F401RE', 'options': ['NUCLEO_F401RE', 'NUCLEO_F103RB', 'NUCLEO_L476RG', 'NUCLEO_F429ZI'] }, 'port': '/dev/ttyACM0', 'baud': 115200, 'filename': 'Sketch.ino', 'script': &quot;# needs the STMicroelectronics:stm32 core. $BOARD is the bare board name;\n# the full FQBN is built below. The default MassStorage upload needs the\n# NODE_* volume, absent in the container, so flash via the on-board ST-LINK.\ncase $BOARD in\n  NUCLEO_F429ZI|NUCLEO_F746ZG|NUCLEO_H743ZI2) FAMILY=Nucleo_144;;\n  *) FAMILY=Nucleo_64;;\nesac\nFQBN=STMicroelectronics:stm32:$FAMILY:pnum=$BOARD,upload_method=OpenOCDSTLink\nSKETCH=$(basename $FILE .ino)\nrm -rf $SKETCH &amp;&amp; arduino-cli sketch new $SKETCH\necho $CODE | base64 --decode > $SKETCH/$SKETCH.ino\narduino-cli compile -b $FQBN $SKETCH &amp;&amp;\n  arduino-cli upload -b $FQBN -p $PORT $SKETCH &amp;&amp;\n  arduino-cli monitor -p $PORT -c baudrate=$BAUD&quot; },
              'avr-gcc': { 'board': { 'value': 'avr128db48', 'options': ['avr128db48', 'atmega328p', 'atmega2560', 'attiny85'] }, 'port': '/dev/ttyUSB0', 'baud': 9600, 'filename': 'main.c', 'script': &quot;BASE=$(basename $FILE .c)\necho $CODE | base64 --decode > $FILE\navr-gcc -mmcu=$BOARD -Os -DF_CPU=20000000UL -o $BASE.elf $FILE &amp;&amp;\n  avr-objcopy -O ihex $BASE.elf $BASE.hex &amp;&amp;\n  avrdude -c serialupdi -P $PORT -p $BOARD -U flash:w:$BASE.hex:i &amp;&amp;\n  screen $PORT $BAUD&quot; },
              'micropython': { 'board': { 'value': '', 'options': [] }, 'port': 'auto', 'baud': 115200, 'filename': 'main.py', 'script': &quot;echo $CODE | base64 --decode > $FILE\nmpremote connect $PORT fs cp $FILE :$FILE &amp;&amp;\n  mpremote connect $PORT exec \&quot;\nimport sys\nif 'main' in sys.modules:\n    del sys.modules['main']\nimport main\n\&quot;&quot; },
              'native': { 'board': { 'value': '', 'options': [] }, 'port': '', 'baud': 9600, 'filename': 'main.py', 'script': &quot;echo $CODE | base64 --decode > $FILE\npython3 $FILE&quot; },
            },
          },
          'board': {
            'type': 'combobox',
            'hint': 'Board identifier for the selected workflow (arduino-cli FQBN or avrdude/avr-gcc MCU). Free text is allowed.',
            'options': ['arduino:avr:uno', 'arduino:avr:mega', 'arduino:avr:nano', 'esp32:esp32:esp32', 'arduino:esp32:nano_nora', 'NUCLEO_F401RE', 'avr128db48'],
          },
          'port': {
            'type': 'string',
            'hint': 'Serial port of the device (e.g.: /dev/ttyACM0, /dev/ttyUSB0)'
          },
          'baud': {
            'type': 'number',
            'hint': 'Baud rate used for serial monitoring (default: 9600)'
          },
          'filename': {
            'type': 'string',
            'hint': 'Name of the file the code is written to (e.g.: Blink.ino, main.py, main.c)'
          },
          'script': {
            'type': 'code-area',
            'hint': 'Script to be executed. Overrides the workflow. $CODE is replaced by the base64 code, $BOARD / $PORT / $BAUD / $FILE by the fields above. (e.g.: echo $CODE | base64 --decode)'
          },
          'enable': {
            'type': 'checkboxes',
            'hint': 'Enable student and/or teacher to execute code',
            'options': ['student', 'teacher'],
          }
        },
      }"><link rel=stylesheet href=https://unpkg.com/xterm@4.11.0/css/xterm.css><script defer src=https://edrys-labs.github.io/module/vendor/alpine.min.js></script><link rel=stylesheet href=https://edrys-labs.github.io/module/vendor/water.min.css><link rel=stylesheet href=https://edrys-labs.github.io/module/vendor/open-iconic/css/open-iconic.min.css><script src=https://edrys-labs.github.io/module/edrys.js></script><script src=https://unpkg.com/vue@3></script><body style=max-width:100%;margin-bottom:0;padding-left:0>
    <div id=app>
      <span class=title>pyxterm.js</span>
      <span class=status>
        <span class=label>status:</span>
        <span v-if="status === false" class="badge off">disconnected</span>
        <span v-if="status === null" class="badge wait">connecting ...</span>
        <span v-if="status === true" class="badge on">connected</span>
      </span>

      <span class=controls v-if=isStation>
        <label>
          student: <input type=checkbox v-model=enable.student>
        </label>
        <label>
          teacher: <input type=checkbox v-model=enable.teacher>
        </label>
        <input type=input v-model=server>
        <button @click=reload()>reload</button>
      </span>

      <textarea v-model=script v-if=isStation></textarea>
    </div>

    <div style="width:calc(100% + 10px);height:inherit" id=terminal></div>

    
    <script src=https://unpkg.com/xterm@4.11.0/lib/xterm.js></script>
    <script src=https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js></script>
    <script src=https://unpkg.com/xterm-addon-web-links@0.4.0/lib/xterm-addon-web-links.js></script>
    <script src=https://unpkg.com/xterm-addon-search@0.8.0/lib/xterm-addon-search.js></script>
    <script src=https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js></script>

    
    <script type=module src=module-pyxtermjs.175e4e12.js></script>
