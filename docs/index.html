<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Python Terminal-Server</title>

    <meta
      name="description"
      content="This is a terminal-server based on <a href='https://github.com/cs01/pyxtermjs' target='_blank'>pyxtermjs</a>. A server should be started locally and shared in station mode. For more information and configuration options, see <br><a href='https://github.com/edrys-labs/module-pyxtermjs' target='_blank'>edrys-labs/module-pyxtermjs</a>"
    />

    <style>
      html {
        font-family: arial;
      }

      #app {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1rem;
        margin-bottom: 0.5rem;
      }

      .title {
        font-size: 1.4em;
        line-height: 1;
      }

      /* inherit: water.css has a light and a dark variant, a fixed grey would
         be unreadable in one of them */
      .status {
        font-size: small;
        color: inherit;
      }
      .status > .label {
        opacity: 0.7;
      }

      .status .badge {
        display: inline-block;
        padding: 0.1rem 0.5rem;
        border-radius: 999px;
        font-weight: bold;
        color: #fff;
      }
      /* dark enough for white text to clear WCAG AA */
      .status .badge.on {
        background-color: #1f7a45;
      }
      .status .badge.off {
        background-color: #b8384a;
      }
      .status .badge.wait {
        background-color: #6b6b6b;
      }

      .controls {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: small;
      }
      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        margin: 0;
        white-space: nowrap;
      }
      .controls input[type='checkbox'] {
        margin: 0;
      }
      .controls input[type='input'] {
        margin: 0;
        width: 15rem;
        font-family: monospace;
        font-size: 0.95em;
      }
      .controls button {
        margin: 0;
        white-space: nowrap;
      }

      /* must match the xterm theme background, or the padding shows a seam */
      #terminal {
        background: #1a1b26;
        border-radius: 6px;
        padding: 6px 0 6px 6px;
      }

      /* scoped to #terminal - the chrome outside keeps water.css */
      #terminal ::-webkit-scrollbar {
        width: 10px;
      }
      #terminal ::-webkit-scrollbar-track {
        background: #1a1b26;
      }
      #terminal ::-webkit-scrollbar-thumb {
        background: #414868;
        border-radius: 5px;
      }
      #terminal ::-webkit-scrollbar-thumb:hover {
        background: #565f89;
      }
      /* firefox */
      #terminal .xterm-viewport {
        scrollbar-width: thin;
        scrollbar-color: #414868 #1a1b26;
      }

      #app textarea {
        flex: 1 0 100%;
        height: 4.25rem;
        margin: 0;
        font-family: monospace;
        font-size: 0.95em;
        resize: vertical;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://unpkg.com/xterm@4.11.0/css/xterm.css"
    />

    <meta name="show-in" content="station" />

    <meta 
      name="module-config" 
      content="{
        'stationConfig': {
          'server': {
            'type': string,
            'hint': 'Default terminal-server URl (http://localhost:5000/pty)'
          },
          'execute': {
            'type': string,
            'hint': 'Message subject to execute code (default: execute)'
          },
          'workflow': {
            'type': select,
            'hint': 'Terminal workflow (toolchain). Fills in the script below. Leave empty to write your own script.',
            'options': ['arduino-avr', 'arduino-esp32', 'avr-gcc', 'micropython', 'mbed', 'native'],
            'presets': {
              'arduino-avr': { 'board': { 'value': 'arduino:avr:uno', 'options': ['arduino:avr:uno', 'arduino:avr:mega', 'arduino:avr:nano', 'arduino:megaavr:nona4809', 'arduino:avr:leonardo', 'arduino:avr:micro'] }, 'port': '/dev/ttyACM0', 'baud': 9600, 'filename': 'Sketch.ino', 'script': &quot;SKETCH=$(basename $FILE .ino)\nrm -rf $SKETCH && arduino-cli sketch new $SKETCH\necho $CODE | base64 --decode > $SKETCH/$SKETCH.ino\narduino-cli compile -b $BOARD $SKETCH &&\n  arduino-cli upload -b $BOARD -p $PORT $SKETCH &&\n  arduino-cli monitor -p $PORT -c baudrate=$BAUD&quot; },
              'arduino-esp32': { 'board': { 'value': 'esp32:esp32:esp32', 'options': ['esp32:esp32:esp32', 'esp32:esp32:esp32s3', 'esp32:esp32:esp32c3'] }, 'port': '/dev/ttyUSB0', 'baud': 115200, 'filename': 'Sketch.ino', 'script': &quot;# needs the :esp32 image tag (the ESP32 core is not in :latest)\nSKETCH=$(basename $FILE .ino)\nrm -rf $SKETCH && arduino-cli sketch new $SKETCH\necho $CODE | base64 --decode > $SKETCH/$SKETCH.ino\narduino-cli compile -b $BOARD $SKETCH &&\n  arduino-cli upload -b $BOARD -p $PORT $SKETCH &&\n  arduino-cli monitor -p $PORT -c baudrate=$BAUD&quot; },
              'avr-gcc': { 'board': { 'value': 'avr128db48', 'options': ['avr128db48', 'atmega328p', 'atmega2560', 'attiny85'] }, 'port': '/dev/ttyUSB0', 'baud': 9600, 'filename': 'main.c', 'script': &quot;BASE=$(basename $FILE .c)\necho $CODE | base64 --decode > $FILE\navr-gcc -mmcu=$BOARD -Os -DF_CPU=20000000UL -o $BASE.elf $FILE &&\n  avr-objcopy -O ihex $BASE.elf $BASE.hex &&\n  avrdude -c serialupdi -P $PORT -p $BOARD -U flash:w:$BASE.hex:i &&\n  screen $PORT $BAUD&quot; },
              'micropython': { 'board': { 'value': '', 'options': [] }, 'port': 'auto', 'baud': 115200, 'filename': 'main.py', 'script': &quot;echo $CODE | base64 --decode > $FILE\nmpremote connect $PORT fs cp $FILE :$FILE &&\n  mpremote connect $PORT exec \&quot;\nimport sys\nif 'main' in sys.modules:\n    del sys.modules['main']\nimport main\n\&quot;&quot; },
              'mbed': { 'board': { 'value': 'DISCO_L475VG_IOT01A', 'options': ['DISCO_L475VG_IOT01A', 'PORTENTA_H7_M7', 'NUCLEO_F401RE'] }, 'port': '/dev/ttyACM0', 'baud': 9600, 'filename': 'main.cpp', 'script': &quot;PROJECT=mbed_project\n[ -d \&quot;$PROJECT\&quot; ] || mbed-tools new $PROJECT\necho $CODE | base64 --decode > $PROJECT/$FILE\ncd $PROJECT &&\n  mbed-tools compile -m $BOARD -t GCC_ARM -f &&\n  mbed-tools sterm -p $PORT -b $BAUD&quot; },
              'native': { 'board': { 'value': '', 'options': [] }, 'port': '', 'baud': 9600, 'filename': 'main.py', 'script': &quot;echo $CODE | base64 --decode > $FILE\npython3 $FILE&quot; },
            },
          },
          'board': {
            'type': combobox,
            'hint': 'Board identifier for the selected workflow (arduino-cli FQBN, avrdude/avr-gcc MCU or mbed target). Free text is allowed.',
            'options': ['arduino:avr:uno', 'arduino:avr:mega', 'arduino:avr:nano', 'esp32:esp32:esp32', 'avr128db48', 'DISCO_L475VG_IOT01A'],
          },
          'port': {
            'type': string,
            'hint': 'Serial port of the device (e.g.: /dev/ttyACM0, /dev/ttyUSB0)'
          },
          'baud': {
            'type': number,
            'hint': 'Baud rate used for serial monitoring (default: 9600)'
          },
          'filename': {
            'type': string,
            'hint': 'Name of the file the code is written to (e.g.: Blink.ino, main.py, main.c)'
          },
          'script': {
            'type': code-area,
            'hint': 'Script to be executed. Overrides the workflow. $CODE is replaced by the base64 code, $BOARD / $PORT / $BAUD / $FILE by the fields above. (e.g.: echo $CODE | base64 --decode)'
          },
          'enable': {
            'type': checkboxes,
            'hint': 'Enable student and/or teacher to execute code',
            'options': ['student', 'teacher'],
          }
        },
      }" 
    />

    <script
      defer
      src="https://edrys-labs.github.io/module/vendor/alpine.min.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://edrys-labs.github.io/module/vendor/water.min.css"
    />
    <link
      rel="stylesheet"
      href="https://edrys-labs.github.io/module/vendor/open-iconic/css/open-iconic.min.css"
    />
    <script src="https://edrys-labs.github.io/module/edrys.js"></script>
    <script src="https://unpkg.com/vue@3"></script>
  </head>

  <body style="max-width: 100%; padding-left: 0px; margin-bottom: 0px">
    <div id="app">
      <span class="title">pyxterm.js</span>
      <span class="status">
        <span class="label">status:</span>
        <span v-if="status === false" class="badge off">disconnected</span>
        <span v-if="status === null" class="badge wait">connecting ...</span>
        <span v-if="status === true" class="badge on">connected</span>
      </span>

      <span class="controls" v-if="isStation">
        <label>
          student: <input type="checkbox" v-model="enable.student" />
        </label>
        <label>
          teacher: <input type="checkbox" v-model="enable.teacher" />
        </label>
        <input type="input" v-model="server" />
        <button @click="reload()">reload</button>
      </span>

      <textarea v-model="script" v-if="isStation"></textarea>
    </div>

    <div style="width: calc(100% + 10px); height: inherit" id="terminal"></div>

    <!-- xterm -->
    <script src="https://unpkg.com/xterm@4.11.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>
    <script src="https://unpkg.com/xterm-addon-web-links@0.4.0/lib/xterm-addon-web-links.js"></script>
    <script src="https://unpkg.com/xterm-addon-search@0.8.0/lib/xterm-addon-search.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>

    <script>
      var toUtf8 = function (text) {
        var surrogate = encodeURIComponent(text)
        var result = ''
        for (var i = 0; i < surrogate.length; ) {
          var character = surrogate[i]
          i += 1
          if (character == '%') {
            var hex = surrogate.substring(i, (i += 2))
            if (hex) {
              result += String.fromCharCode(parseInt(hex, 16))
            }
          } else {
            result += character
          }
        }
        return result
      }

      const { createApp } = Vue

      var terminal = null
      var fit = null
      var socket = null
      var lastData = null
      
      // Add session management
      var sessionId = null
      var isProcessingInput = false
      var inputQueue = []
      var messageHandlersRegistered = false

      const DEFAULT_SERVER = 'http://localhost:5000/pty'
      const DEFAULT_SCRIPT = 'echo $CODE | base64 --decode'

      // Built-in terminal workflows.
      const WORKFLOWS = {
        'arduino-avr': {
          filename: 'Sketch.ino',
          board: 'arduino:avr:uno',
          boards: [
            'arduino:avr:uno',
            'arduino:avr:mega',
            'arduino:avr:nano',
            'arduino:megaavr:nona4809',
            'arduino:avr:leonardo',
            'arduino:avr:micro',
          ],
          port: '/dev/ttyACM0',
          baud: 9600,
          script: [
            'SKETCH=$(basename $FILE .ino)',
            'rm -rf $SKETCH && arduino-cli sketch new $SKETCH',
            'echo $CODE | base64 --decode > $SKETCH/$SKETCH.ino',
            'arduino-cli compile -b $BOARD $SKETCH &&',
            '  arduino-cli upload -b $BOARD -p $PORT $SKETCH &&',
            '  arduino-cli monitor -p $PORT -c baudrate=$BAUD',
          ].join('\n'),
        },

        'arduino-esp32': {
          filename: 'Sketch.ino',
          board: 'esp32:esp32:esp32',
          boards: ['esp32:esp32:esp32', 'esp32:esp32:esp32s3', 'esp32:esp32:esp32c3'],
          port: '/dev/ttyUSB0',
          baud: 115200,
          script: [
            '# needs the :esp32 image tag (the ESP32 core is not in :latest)',
            'SKETCH=$(basename $FILE .ino)',
            'rm -rf $SKETCH && arduino-cli sketch new $SKETCH',
            'echo $CODE | base64 --decode > $SKETCH/$SKETCH.ino',
            'arduino-cli compile -b $BOARD $SKETCH &&',
            '  arduino-cli upload -b $BOARD -p $PORT $SKETCH &&',
            '  arduino-cli monitor -p $PORT -c baudrate=$BAUD',
          ].join('\n'),
        },

        'avr-gcc': {
          filename: 'main.c',
          board: 'avr128db48',
          boards: ['avr128db48', 'atmega328p', 'atmega2560', 'attiny85'],
          port: '/dev/ttyUSB0',
          baud: 9600,
          script: [
            'BASE=$(basename $FILE .c)',
            'echo $CODE | base64 --decode > $FILE',
            'avr-gcc -mmcu=$BOARD -Os -DF_CPU=20000000UL -o $BASE.elf $FILE &&',
            '  avr-objcopy -O ihex $BASE.elf $BASE.hex &&',
            '  avrdude -c serialupdi -P $PORT -p $BOARD -U flash:w:$BASE.hex:i &&',
            '  screen $PORT $BAUD',
          ].join('\n'),
        },

        micropython: {
          filename: 'main.py',
          board: '',
          boards: [],
          port: 'auto',
          baud: 115200,
          script: [
            'echo $CODE | base64 --decode > $FILE',
            'mpremote connect $PORT fs cp $FILE :$FILE &&',
            '  mpremote connect $PORT exec "',
            'import sys',
            "if 'main' in sys.modules:",
            "    del sys.modules['main']",
            'import main',
            '"',
          ].join('\n'),
        },

        mbed: {
          filename: 'main.cpp',
          board: 'DISCO_L475VG_IOT01A',
          boards: ['DISCO_L475VG_IOT01A', 'PORTENTA_H7_M7', 'NUCLEO_F401RE'],
          port: '/dev/ttyACM0',
          baud: 9600,
          script: [
            'PROJECT=mbed_project',
            '[ -d "$PROJECT" ] || mbed-tools new $PROJECT',
            'echo $CODE | base64 --decode > $PROJECT/$FILE',
            'cd $PROJECT &&',
            '  mbed-tools compile -m $BOARD -t GCC_ARM -f &&',
            '  mbed-tools sterm -p $PORT -b $BAUD',
          ].join('\n'),
        },

        native: {
          filename: 'main.py',
          board: '',
          boards: [],
          port: '',
          baud: 9600,
          script: ['echo $CODE | base64 --decode > $FILE', 'python3 $FILE'].join(
            '\n'
          ),
        },
      }

      // Resolution order: an explicit script always wins, then the selected
      // workflow's template, then the historic default. All 14 existing labs
      // set `script` and no `workflow`, so they keep their exact behaviour.
      function resolveScript(config) {
        if (config?.script) {
          return config.script
        }

        return WORKFLOWS[config?.workflow]?.script || DEFAULT_SCRIPT
      }

      // A field is taken from the config when set, otherwise from the workflow.
      function resolveField(config, name) {
        const value = config?.[name]

        if (value !== undefined && value !== null && value !== '') {
          return value
        }

        return WORKFLOWS[config?.workflow]?.[name] ?? ''
      }

      function generateSessionId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2);
      }

      function fitToScreen(dimensions) {
        if (fit && terminal) {
          fit.fit()

          let dims = {
            cols: terminal.cols,
            rows: terminal.rows,
          }

          if (dimensions?.cols && dimensions?.rows) {
            dims = dimensions
          }

          // console.log("sending new dimensions to server's pty", dims);
          if (socket) {
            socket.emit('resize', dims)
          } else {
            try {
              Edrys.sendMessage('resize', dims)
            } catch (e) {}
          }
        }
      }

      function debounce(func, wait_ms) {
        let timeout
        return function (...args) {
          const context = this
          clearTimeout(timeout)
          timeout = setTimeout(() => func.apply(context, args), wait_ms)
        }
      }

      function throttle(cb, delay = 100) {
        let storedChange = ''
        let timerID = null
        let isProcessing = false

        function checkStoredArgs() {
          if (storedChange.length > 0 && !isProcessing) {
            isProcessing = true
            const dataToSend = storedChange
            storedChange = ''
            cb(dataToSend)
            isProcessing = false
          }
          timerID = null
        }

        return (change) => {
          if (timerID) {
            window.clearTimeout(timerID)
          }

          if (change !== null && typeof change === 'string') {
            storedChange += change
          }

          timerID = window.setTimeout(checkStoredArgs, delay)
        }
      }

      const app = createApp({
        data() {
          return {
            status: null,
            isStation: false,
            connected: false,
            enable: {
              student: false,
              teacher: false,
            },
            server: DEFAULT_SERVER,
            script: DEFAULT_SCRIPT,
            board: '',
            port: '',
            baud: '',
            filename: '',
          }
        },
        methods: {
          reload() {
            if (socket) {
              socket.removeAllListeners()
              socket.close()
            }
            // Reset session
            sessionId = generateSessionId()
            messageHandlersRegistered = false
            this.connectStation()
          },

          execute(code) {
            // add two time ctrl+c to stop a possible execution
            let program = '\u0003\u0003\n' + this.script

            if (!program.endsWith('\n')) {
              program += '\n'
            }

            program = program
              .replaceAll('$BOARD', this.board)
              .replaceAll('$PORT', this.port)
              .replaceAll('$BAUD', this.baud)
              .replaceAll('$FILE', this.filename)
              .replaceAll('$CODE', btoa(toUtf8(code)))

            if (typeof Edrys !== 'undefined') {
              const executeCmd = Edrys.module?.stationConfig?.execute || 'execute'
              Edrys.sendMessage('input_' + Edrys.role + '_' + executeCmd, program)
            }
          },

          store(file) {
            let command = ''

            for (const name in file) {
              let content = file[name]

              if (!content.endsWith('\n')) {
                content += '\n'
              }

              command += `echo ${btoa(
                toUtf8(content)
              )} | base64 --decode > ${toUtf8(name)}\n`
            }

            if (typeof Edrys !== 'undefined') {
              const executeCmd = Edrys.module?.stationConfig?.execute || 'execute'
              Edrys.sendMessage('input_' + Edrys.role + '_' + executeCmd, command)
            }
          },

          initTerminal() {
            if (terminal) {
              terminal.dispose()
            }

            sessionId = generateSessionId()

            terminal = new Terminal({
              cursorBlink: true,
              macOptionIsMeta: true,
              scrollback: 10000,
              fontFamily:
                "'JetBrains Mono', 'Fira Code', 'Cascadia Mono', 'SF Mono', 'Menlo', 'Consolas', monospace",
              fontSize: 14,
              lineHeight: 1.3,
              cursorStyle: 'bar',
              cursorWidth: 2,
              // keep in sync with the #terminal background in <style>
              theme: {
                background: '#1a1b26',
                foreground: '#c0caf5',
                cursor: '#c0caf5',
                cursorAccent: '#1a1b26',
                selectionBackground: '#33467c',
                black: '#15161e',
                red: '#f7768e',
                green: '#9ece6a',
                yellow: '#e0af68',
                blue: '#7aa2f7',
                magenta: '#bb9af7',
                cyan: '#7dcfff',
                white: '#a9b1d6',
                brightBlack: '#414868',
                brightRed: '#ff7a93',
                brightGreen: '#b9f27c',
                brightYellow: '#ff9e64',
                brightBlue: '#7da6ff',
                brightMagenta: '#bb9af7',
                brightCyan: '#0db9d7',
                brightWhite: '#c0caf5',
              },
            })

            // https://github.com/xtermjs/xterm.js/issues/2941
            terminal.attachCustomKeyEventHandler(customKeyEventHandler)

            // A shell clearing the screen (ctrl+l, `clear`, tput clear, ...)
            // emits CSI 2 J, which only wipes the viewport - the scrollback
            // survives and reappears when scrolling up. Hooking the sequence
            // instead of a keystroke covers every way of triggering it.
            // Returning false lets xterm still perform its normal handling.
            terminal.parser.registerCsiHandler({ final: 'J' }, (params) => {
              if (params[0] === 2 || params[0] === 3) {
                setTimeout(() => terminal.clear(), 0)
              }
              return false
            })

            fit = new FitAddon.FitAddon()
            terminal.loadAddon(fit)
            terminal.loadAddon(new WebLinksAddon.WebLinksAddon())
            terminal.loadAddon(new SearchAddon.SearchAddon())

            terminal.open(document.getElementById('terminal'))
            fit.fit()
            terminal.resize(12, Math.round((window.innerHeight - 32) / 18.5))
            fit.fit()
            terminal.writeln('Welcome to pyxterm.js!')
            terminal.writeln('https://github.com/cs01/pyxterm.js')
            terminal.writeln('')
            terminal.writeln('You can copy with ctrl+shift+x')
            terminal.writeln('You can paste with ctrl+shift+v')
            terminal.writeln('')

            // Improved throttling with deduplication
            const tx = throttle((data) => {
              if (typeof Edrys !== 'undefined' && !isProcessingInput) {
                isProcessingInput = true
                const executeCmd = Edrys.module?.stationConfig?.execute || 'execute'
                Edrys.sendMessage('input_' + Edrys.role + '_' + executeCmd, data)
                setTimeout(() => {
                  isProcessingInput = false
                }, 50)
              }
            }, 50)

            terminal.onData((data) => {
              if (socket && socket.connected) {
                socket.emit('pty-input', {
                  input: data,
                  sessionId: sessionId
                })
              } else if (typeof Edrys !== 'undefined') {
                tx(data)
              }
            })

            function customKeyEventHandler(e) {
              if (e.type !== 'keydown') {
                return true
              }
              if (e.ctrlKey && e.shiftKey) {
                const key = e.key.toLowerCase()
                if (key === 'v') {
                  navigator.clipboard.readText().then((toPaste) => {
                    if (socket && socket.connected) {
                      socket.emit('pty-input', {
                        input: toPaste,
                        sessionId: sessionId
                      })
                    } else if (typeof Edrys !== 'undefined') {
                      tx(toPaste)
                    }
                  })
                  return false
                } else if (key === 'c' || key === 'x') {
                  const toCopy = terminal.getSelection()
                  navigator.clipboard.writeText(toCopy)
                  terminal.focus()
                  return false
                }
              }
              return true
            }

            const wait_ms = 50
            window.onresize = debounce(fitToScreen, wait_ms)
          },

          connectUser() {
            if (messageHandlersRegistered) return
            messageHandlersRegistered = true

            const self = this

            if (typeof Edrys !== 'undefined') {
              Edrys.onMessage(({ from, subject, body }) => {
                // Prevent processing own messages
                if (from === Edrys.liveUser?.name) return

                const executeCmd = Edrys.module?.stationConfig?.execute || 'execute'

                if (subject === 'pty-output_' + executeCmd) {
                  if (terminal && typeof body === 'string') {
                    terminal.write(body)
                  }
                } else if (subject === 'connect_' + executeCmd) {
                  if (body === true) {
                    self.status = true
                  } else if (body === false) {
                    self.status = false
                  } else {
                    self.status = null
                  }
                  fitToScreen()
                }
              })
            }
          },

          connectStation() {
            if (messageHandlersRegistered) return
            messageHandlersRegistered = true

            const self = this

            socket = io.connect(this.server, {
              reconnectionAttempts: 10,
              timeout: 5000,
              forceNew: true
            })

            socket.on('connect_error', (error) => {
              console.log('Connection error:', error.message)
              self.status = false
            })

            socket.on('pty-output', function (data) {
              if (terminal && data.output) {
                terminal.write(data.output)
                if (typeof Edrys !== 'undefined') {
                  const executeCmd = Edrys.module?.stationConfig?.execute || 'execute'
                  Edrys.sendMessage('pty-output_' + executeCmd, data.output)
                }
                lastData = data.output
              }
            })

            socket.on('connect', () => {
              console.log('Socket connected with session:', sessionId)
              fitToScreen()
              self.status = true
              if (typeof Edrys !== 'undefined') {
                const executeCmd = Edrys.module?.stationConfig?.execute || 'execute'
                Edrys.sendMessage('connect_' + executeCmd, true)
              }

              // Send initial enter to receive outputs
              socket.emit('pty-input', {
                input: '\n',
                sessionId: sessionId
              })
            })

            socket.on('disconnect', () => {
              console.log('Socket disconnected')
              self.status = false
              if (typeof Edrys !== 'undefined') {
                const executeCmd = Edrys.module?.stationConfig?.execute || 'execute'
                Edrys.sendMessage('connect_' + executeCmd, false)
              }
            })

            if (typeof Edrys !== 'undefined') {
              Edrys.onMessage(({ from, subject, body }) => {
                switch (subject) {
                  default: {
                    const executeCmd = Edrys.module?.stationConfig?.execute || 'execute'
                    if (subject === 'input_teacher_' + executeCmd) {
                      if (self.enable.teacher && socket && socket.connected) {
                        socket.emit('pty-input', {
                          input: body,
                          sessionId: sessionId
                        })
                      }
                    } else if (subject === 'input_student_' + executeCmd) {
                      if (self.enable.student && socket && socket.connected) {
                        socket.emit('pty-input', {
                          input: body,
                          sessionId: sessionId
                        })
                      }
                    } else if (subject === 'input_station_' + executeCmd) {
                      if (socket && socket.connected) {
                        socket.emit('pty-input', {
                          input: body,
                          sessionId: sessionId
                        })
                      }
                    }
                    break
                  }
                  case 'join': {
                    if (typeof Edrys !== 'undefined') {
                      const executeCmd = Edrys.module?.stationConfig?.execute || 'execute'
                      Edrys.sendMessage('connect_' + executeCmd, self.status, from)
                      if (lastData) {
                        Edrys.sendMessage('pty-output_' + executeCmd, lastData, from)
                      }
                    }
                    break
                  }
                  case 'resize': {
                    fitToScreen(body)
                    break
                  }
                }
              })

              Edrys.onMessage(({ from, subject, body, module }) => {
                if (subject === (Edrys.module?.stationConfig?.execute || 'execute')) {
                  try {
                    let data = body

                    if (data.file) {
                      self.store(data.file)
                      self.execute('')
                      return
                    }
                  } catch (e) {
                    console.warn('Error, could not execute command:', e.message)
                  }

                  self.execute(body)
                }
              }, promiscuous = true)
            }
          },
        },
      }).mount('#app')

      app.initTerminal()

      // Initialize when Edrys is ready
      if (typeof Edrys !== 'undefined') {
        Edrys.onReady(() => {
          console.log('pyxtermjs is loaded!')

          if (Edrys.role === 'station') {
            app.isStation = true
            const stationConfig = Edrys.module?.stationConfig

            app.server = stationConfig?.server || DEFAULT_SERVER
            app.script = resolveScript(stationConfig)
            app.board = resolveField(stationConfig, 'board')
            app.port = resolveField(stationConfig, 'port')
            app.baud = resolveField(stationConfig, 'baud')
            app.filename = resolveField(stationConfig, 'filename')
            app.enable.student = Edrys.module?.stationConfig?.enable?.student || false
            app.enable.teacher = Edrys.module?.stationConfig?.enable?.teacher || false

            app.connectStation()
            Edrys.sendMessage('join', null)
          } else {
            app.connectUser()

            function join() {
              setTimeout(() => {
                if (app.status === null) {
                  console.log('re-joining')
                  Edrys.sendMessage('join', null)
                  join()
                }
              }, 1000)
            }

            join()
          }
        })
      }

      // Fallback initialization
      setTimeout(function () {
        if (typeof Edrys === 'undefined' || !Edrys.module) {
          console.warn('Edrys not available, connecting directly')
          app.connectStation()
        }
      }, 5000)
    </script>
  </body>
</html>
