name: Docker Build and Publish
# Manual only: pick the images to publish from the Actions tab.
#
# The images form a chain - arduino is FROM :base, esp32 is FROM :latest
# (the arduino image). Rebuilding a parent without its children leaves the
# children published on the old parent layer, so when you change a parent,
# tick its children too.
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'base (parent of all others)'
        type: boolean
        default: false
      arduino:
        description: 'arduino / :latest (FROM :base)'
        type: boolean
        default: false
      esp32:
        description: 'esp32 (FROM :latest, ~7.5 GB)'
        type: boolean
        default: false
      development:
        description: 'development (FROM :base)'
        type: boolean
        default: false
jobs:
  base:
    if: inputs.base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image (BASE)
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=edryslabs/module-pyxtermjs:base-cache
          cache-to: type=registry,ref=edryslabs/module-pyxtermjs:base-cache,mode=max
          tags: |
            edryslabs/module-pyxtermjs:base
            edryslabs/module-pyxtermjs:base-${{ github.run_number }}
  arduino:
    # runs if selected; waits for base only when base was also selected
    if: inputs.arduino && !failure() && !cancelled()
    runs-on: ubuntu-latest
    needs: base
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Wait a moment for base image to be available
      - name: Wait for base image
        if: inputs.base
        run: sleep 30
      - name: Build and push Docker image (ARDUINO)
        uses: docker/build-push-action@v5
        with:
          context: ./docker/arduino
          file: ./docker/arduino/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=edryslabs/module-pyxtermjs:arduino-cache
          cache-to: type=registry,ref=edryslabs/module-pyxtermjs:arduino-cache,mode=max
          tags: |
            edryslabs/module-pyxtermjs:arduino-v${{ github.run_number }}
            edryslabs/module-pyxtermjs:latest
  esp32:
    # builds on :latest (the arduino image), not :base
    if: inputs.esp32 && !failure() && !cancelled()
    runs-on: ubuntu-latest
    needs: arduino
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Free disk space
        # the Espressif core is ~5.4 GB installed and overruns the default runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Wait a moment for the arduino image to be available
      - name: Wait for arduino image
        if: inputs.arduino
        run: sleep 30
      - name: Build and push Docker image (ESP32)
        uses: docker/build-push-action@v5
        with:
          context: ./docker/esp32
          file: ./docker/esp32/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=edryslabs/module-pyxtermjs:esp32-cache
          cache-to: type=registry,ref=edryslabs/module-pyxtermjs:esp32-cache,mode=max
          tags: |
            edryslabs/module-pyxtermjs:esp32-v${{ github.run_number }}
            edryslabs/module-pyxtermjs:esp32
  development:
    if: inputs.development && !failure() && !cancelled()
    runs-on: ubuntu-latest
    needs: base
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Wait a moment for base image to be available
      - name: Wait for base image
        if: inputs.base
        run: sleep 30
      - name: Build and push Docker image (DEVELOPMENT)
        uses: docker/build-push-action@v5
        with:
          context: ./docker/development
          file: ./docker/development/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=edryslabs/module-pyxtermjs:development-cache
          cache-to: type=registry,ref=edryslabs/module-pyxtermjs:development-cache,mode=max
          tags: |
            edryslabs/module-pyxtermjs:development-v${{ github.run_number }}
            edryslabs/module-pyxtermjs:development